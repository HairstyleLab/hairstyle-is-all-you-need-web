{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
    <title>3D Viewer - 헤어스타일 3D 모델</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no" />
    <style>
        body {
            overflow: hidden;
            margin: 0;
            height: 100vh;
            width: 100vw;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f5f5;
        }

        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            z-index: 100;
        }

        .header-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }

        .back-btn {
            padding: 8px 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }

        .back-btn:hover {
            background: #5568d3;
        }

        .viewer-container {
            position: absolute;
            top: 60px;
            left: 0;
            right: 0;
            bottom: 0;
        }

        .cube-wrapper {
            transform-style: preserve-3d;
        }

        .cube {
            transform-style: preserve-3d;
            transform: rotateX(45deg) rotateZ(45deg);
            animation: rotation 2s infinite;
        }

        .cube-faces {
            transform-style: preserve-3d;
            height: 80px;
            width: 80px;
            position: relative;
            transform-origin: 0 0;
            transform: translateX(0) translateY(0) translateZ(-40px);
        }

        .cube-face {
            position: absolute;
            inset: 0;
            background: #667eea;
            border: solid 1px #ffffff;
        }
        .cube-face.top {
            transform: translateZ(80px);
        }
        .cube-face.front {
            transform-origin: 0 50%;
            transform: rotateY(-90deg);
        }
        .cube-face.back {
            transform-origin: 0 50%;
            transform: rotateY(-90deg) translateZ(-80px);
        }
        .cube-face.right {
            transform-origin: 50% 0;
            transform: rotateX(-90deg) translateY(-80px);
        }
        .cube-face.left {
            transform-origin: 50% 0;
            transform: rotateX(-90deg) translateY(-80px) translateZ(80px);
        }

        @keyframes rotation {
            0% {
                transform: rotateX(45deg) rotateY(0) rotateZ(45deg);
                animation-timing-function: cubic-bezier(0.17, 0.84, 0.44, 1);
            }
            50% {
                transform: rotateX(45deg) rotateY(0) rotateZ(225deg);
                animation-timing-function: cubic-bezier(0.76, 0.05, 0.86, 0.06);
            }
            100% {
                transform: rotateX(45deg) rotateY(0) rotateZ(405deg);
                animation-timing-function: cubic-bezier(0.17, 0.84, 0.44, 1);
            }
        }

        .scene {
            position: absolute;
            display: flex;
            top: 0;
            right: 0;
            left: 0;
            bottom: 0;
            z-index: 2;
            height: 100%;
            width: 100%;
            align-items: center;
            justify-content: center;
        }

        #progress {
            position: absolute;
            top: 60px;
            height: 5px;
            background: #667eea;
            z-index: 99;
            transition: width 0.1s ease-in-out;
        }

        #message {
            position: absolute;
            display: flex;
            top: 60px;
            right: 0;
            left: 0;
            bottom: 0;
            z-index: 2;
            height: calc(100% - 60px);
            width: 100%;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: large;
            color: red;
            pointer-events: none;
        }

        #canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .controls-info {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.95);
            padding: 16px 20px;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15);
            font-size: 13px;
            color: #666;
            z-index: 99;
        }

        .controls-info h4 {
            margin: 0 0 8px 0;
            font-size: 14px;
            color: #333;
            font-weight: 600;
        }

        .controls-info p {
            margin: 4px 0;
        }

        #fps {
            position: fixed;
            top: 70px;
            right: 20px;
            background: rgba(255, 255, 255, 0.95);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            color: #667eea;
            z-index: 99;
        }
    </style>
</head>
<body>
    <!-- 헤더 -->
    <div class="header">
        <div class="header-title">3D 헤어스타일 뷰어</div>
        <button class="back-btn" onclick="window.history.back()">← 갤러리로 돌아가기</button>
    </div>

    <!-- 뷰어 컨테이너 -->
    <div class="viewer-container">
        <div id="progress"></div>
        <div id="message"></div>

        <div class="scene" id="spinner">
            <div class="cube-wrapper">
                <div class="cube">
                    <div class="cube-faces">
                        <div class="cube-face bottom"></div>
                        <div class="cube-face top"></div>
                        <div class="cube-face left"></div>
                        <div class="cube-face right"></div>
                        <div class="cube-face back"></div>
                        <div class="cube-face front"></div>
                    </div>
                </div>
            </div>
        </div>

        <canvas id="canvas"></canvas>

        <div id="fps"></div>
        <div id="camid" style="display:none;"></div>

        <!-- 조작 안내 -->
        <div class="controls-info">
            <h4>🎮 조작 방법</h4>
            <p>🖱️ <strong>마우스 드래그:</strong> 좌우 회전</p>
            <!-- <p>🖱️ <strong>우클릭 드래그:</strong> 이동</p> -->
            <p>🖱️ <strong>스크롤:</strong> 확대/축소</p>
            <!-- <p>⌨️ <strong>화살표:</strong> 이동 / Shift+화살표: 상하 이동</p> -->
        </div>
    </div>

    <script>
        // URL 파라미터 대신 Django 템플릿 변수로 PLY 파일 경로 전달
        window.defaultURL = "{{ ply_url }}";
    </script>
    <script src="{% static 'js/viewer_3d.js' %}"></script>
</body>
</html>
